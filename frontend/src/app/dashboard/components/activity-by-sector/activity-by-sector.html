<!-- ==========================
     ACTIVIDAD POR SECTOR
========================== -->

<article class="chart-card">

  <!-- ==========================
       ENCABEZADO
  ========================== -->

  <header class="chart-header">

    <div>
      <h2>
        Actividad por sector
      </h2>

      <p>
        Tracks detectados por sector analizado
      </p>
    </div>

  </header>


  <!-- ==========================
       CONTENIDO
  ========================== -->

  @if (sectors.length > 0) {

    <div class="chart-container">

      <canvas
        #activitySectorCanvas
      ></canvas>

    </div>

  } @else {

    <div class="empty-state">
      No hay información de sectores disponible.
    </div>

  }

</article>
