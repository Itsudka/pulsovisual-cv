<!-- ==========================
     FILTROS
========================== -->

<div class="filters">

  <!-- ==========================
       ESTADO
  ========================== -->

  <select
    aria-label="Filtrar por estado"
    (change)="onStatusChange($event)"
  >
    <option value="ALL">
      Estado
    </option>

    <option value="ACTIVE">
      Activo
    </option>

    <option value="IN_REVIEW">
      En revisión
    </option>

    <option value="INACTIVE">
      Inactivo
    </option>
  </select>


  <!-- ==========================
       TIPO
  ========================== -->

  <select
    aria-label="Filtrar por tipo"
    (change)="onTypeChange($event)"
  >
    <option value="ALL">
      Tipo
    </option>

    <option value="ENTRADA_SALIDA">
      Entrada / Salida
    </option>

    <option value="PASILLO">
      Pasillo
    </option>

    <option value="ALMACEN">
      Almacen
    </option>

    <option value="ZONA_ATENCION">
      Zona de atención
    </option>

    <option value="ZONA_ESPERA">
      Zona de espera
    </option>

    <option value="AREA_EXHIBICION">
      Área de exhibición
    </option>

    <option value="COMEDOR">
      Comedor
    </option>

    <option value="ESTACIONAMIENTO">
      Estacionamiento
    </option>

    <option value="ESCALERAS_ASCENSORES">
      Escaleras / Ascensores
    </option>

    <option value="OTRO">
      Otro
    </option>
  </select>

</div>
