services:

  # ==========================
  # BASE DE DATOS POSTGRESQL
  # ==========================

  postgres:
    image: postgres:17
    container_name: pulsovisual-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - pulsovisual_postgres_data:/var/lib/postgresql/data


# ==========================
# VOLUMENES
# ==========================

volumes:
  pulsovisual_postgres_data: